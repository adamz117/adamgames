<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Brain Buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --stage:#1a1330;
    --stage-deep:#120c22;
    --card:#241a3f;
    --card-border:#4a3a7a;
    --text:#f5f0ff;
    --text-dim:#a99cd6;
    --gold:#f5c542;
    --gold-bright:#ffe08a;
    --gold-dim:rgba(245,197,66,.2);
    --correct:#3ecf7a;
    --correct-bright:#5ee896;
    --correct-dim:rgba(62,207,122,.2);
    --wrong:#ef4560;
    --wrong-bright:#ff6b82;
    --wrong-dim:rgba(239,69,96,.22);
    --font-display:'Anton','Archivo Black',sans-serif;
    --font-body:'Work Sans','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 20% 0%, rgba(245,197,66,.14) 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(239,69,96,.12) 0%, transparent 40%),
      var(--stage-deep);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
  }
  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 14px;
  }
  header{
    width:100%;
    max-width:520px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }
  .title-block h1{
    font-family:var(--font-display);
    font-size:26px;
    letter-spacing:.02em;
    margin:0;
    color:var(--gold-bright);
    text-shadow:0 0 18px rgba(245,197,66,.35);
  }
  .title-block p{
    margin:2px 0 0;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .header-right{display:flex;align-items:center;gap:8px;}
  .streak-badge{
    display:flex;align-items:center;gap:4px;
    font-weight:700;font-size:13px;
    color:var(--gold-bright);
    background:var(--gold-dim);
    border:1px solid var(--gold);
    border-radius:999px;
    padding:4px 10px;
  }
  .live-score{
    font-family:var(--font-display);
    font-size:13px;
    letter-spacing:.04em;
    color:var(--text);
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:999px;
    padding:5px 12px;
  }
  .live-score span{color:var(--gold-bright);}
  .home-btn,.mute-btn{
    width:32px;height:32px;
    border-radius:50%;
    border:1px solid var(--card-border);
    background:var(--card);
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    cursor:pointer;
  }
  .mute-btn.is-muted::after{content:'\1F507';}
  .mute-btn::after{content:'\1F50A';}

  .progress-dots{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .progress-dot{
    width:30px;height:8px;
    border-radius:4px;
    background:var(--card);
    border:1px solid var(--card-border);
  }
  .progress-dot.is-current{background:var(--gold-dim);border-color:var(--gold);}
  .progress-dot.is-correct{background:var(--correct);border-color:var(--correct);}
  .progress-dot.is-wrong{background:var(--wrong);border-color:var(--wrong);}

  .quiz-card{
    width:100%;
    max-width:520px;
    background:var(--card);
    border:1.5px solid var(--card-border);
    border-radius:14px;
    padding:26px 22px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
  }
  .q-counter{
    font-family:var(--font-body);
    font-weight:700;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 10px;
  }
  .q-text{
    font-family:var(--font-body);
    font-weight:700;
    font-size:20px;
    line-height:1.35;
    margin:0 0 22px;
    color:var(--text);
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .option-btn{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    width:100%;
    background:var(--stage);
    border:1.5px solid var(--card-border);
    border-radius:10px;
    padding:13px 16px;
    color:var(--text);
    font-family:var(--font-body);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:border-color 120ms ease,background 120ms ease,transform 80ms ease;
  }
  .option-btn:hover:not(:disabled){border-color:var(--gold);}
  .option-btn:active:not(:disabled){transform:scale(.98);}
  .option-badge{
    flex:none;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:12px;
    color:var(--text-dim);
  }
  .option-btn:disabled{cursor:default;}
  .option-btn.is-correct{background:var(--correct-dim);border-color:var(--correct);}
  .option-btn.is-correct .option-badge{background:var(--correct);border-color:var(--correct);color:#08210f;}
  .option-btn.is-wrong{background:var(--wrong-dim);border-color:var(--wrong);}
  .option-btn.is-wrong .option-badge{background:var(--wrong);border-color:var(--wrong);color:#2a0308;}

  .summary{
    position:absolute;
    inset:0;
    z-index:5;
    background:rgba(10,6,20,.82);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .summary.hidden{display:none;}
  .summary-card{
    width:min(440px,100%);
    max-height:88vh;
    overflow-y:auto;
    background:var(--card);
    border:1.5px solid var(--gold);
    border-radius:14px;
    padding:28px;
    text-align:center;
    box-shadow:0 0 60px -10px rgba(245,197,66,.25);
  }
  .summary-card h2{
    font-family:var(--font-display);
    font-size:28px;
    letter-spacing:.02em;
    margin:0 0 6px;
    color:var(--gold-bright);
  }
  .summary-score{
    font-family:var(--font-display);
    font-size:22px;
    color:var(--text);
    margin:0 0 4px;
  }
  .summary-meta{font-size:13px;color:var(--text-dim);margin:0 0 18px;}
  .review-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:0 0 20px;
    text-align:left;
  }
  .review-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    background:var(--stage);
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:10px 12px;
    font-size:13px;
  }
  .review-icon{flex:none;font-size:15px;line-height:1.4;}
  .review-text .rq{color:var(--text);font-weight:600;}
  .review-text .ra{color:var(--text-dim);margin-top:2px;}
  .review-text .ra.wrong-answer{color:var(--wrong-bright);}
  .review-text .ra .correct-answer{color:var(--correct-bright);}
  .summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .summary-actions button{
    font-family:var(--font-body);
    font-weight:700;
    font-size:13px;
    border-radius:6px;
    padding:11px 18px;
    cursor:pointer;
  }
  #copyResultBtn{background:var(--gold);color:#2a1d00;border:1px solid var(--gold);}
  #copyResultBtn:hover{background:var(--gold-bright);}
  #closeSummaryBtn{background:transparent;color:var(--text-dim);border:1px solid var(--card-border);}

  .countdown-block{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--card-border);
    text-align:center;
  }
  .countdown-label{font-size:12px;color:var(--text-dim);margin:0 0 8px;}
  .countdown-timer{
    font-family:var(--font-display);
    font-size:26px;
    letter-spacing:.04em;
    color:var(--gold-bright);
    margin:0;
  }
  .countdown-sub{font-size:10px;color:var(--text-dim);margin:6px 0 0;}

  @media (max-width:480px){
    .q-text{font-size:18px;}
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="title-block">
      <h1>Brain Buzzer</h1>
      <p id="dayLabel">Day 1</p>
    </div>
    <div class="header-right">
      <a class="home-btn" href="/" target="_top" aria-label="Back to Adam Games home" title="Back to home">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      </a>
      <div class="streak-badge">🔥 <span id="streakCount">0</span></div>
      <div class="live-score">SCORE <span id="liveScore">0</span>/5</div>
      <button class="mute-btn" id="muteBtn" type="button" aria-label="Toggle sound" title="Toggle sound"></button>
    </div>
  </header>

  <div class="progress-dots" id="progressDots"></div>

  <div class="quiz-card" id="quizCard">
    <p class="q-counter" id="qCounter">Question 1 of 5</p>
    <h2 class="q-text" id="qText"></h2>
    <div class="options" id="optionsWrap"></div>
  </div>

  <div class="summary hidden" id="summary">
    <div class="summary-card">
      <h2 id="summaryTitle">Perfect Score!</h2>
      <p class="summary-score" id="summaryScore">5/5</p>
      <p class="summary-meta" id="summaryMeta"></p>
      <div class="review-list" id="reviewList"></div>
      <div class="summary-actions">
        <button id="copyResultBtn">Copy Result</button>
        <button id="closeSummaryBtn">Close</button>
      </div>
      <div class="countdown-block">
        <p class="countdown-label">You've already played today's quiz</p>
        <p class="countdown-timer" id="countdownTimer">--:--:--</p>
        <p class="countdown-sub">until the next one unlocks</p>
      </div>
    </div>
  </div>
</div>

<script>

q":"In which country did the sport of golf originate?","options":["Wales","Ireland","England","Scotland"],"correct":"Scotland"},{"q":"What part of the body do you use to smell?","options":["Tongue","Nose","Ears","Skin"],"correct":"Nose"},{"q":"Which country was formerly known as Persia?","options":["Turkey","Egypt","Iran","Iraq"],"correct":"Iran"}],[{"q":"Which continent is Kazakhstan located in?","options":["Europe","Asia","South America","Africa"],"correct":"Asia"},{"q":"What do you call a word that means the same as another word?","options":["Synonym","Pronoun","Homonym","Antonym"],"correct":"Synonym"},{"q":"Which musical instrument has keys, pedals, and strings, played by pressing keys?","options":["Piano","Accordion","Harp","Organ"],"correct":"Piano"},{"q":"Which planet is often called Earth's \"twin\" due to similar size?","options":["Saturn","Neptune","Mars","Venus"],"correct":"Venus"},{"q":"What is the capital of Türkiye?","options":["Vaduz","Colombo","Sarajevo","Ankara"],"correct":"Ankara"}],[{"q":"What do you call an animal that eats both plants and meat?","options":["Carnivore","Omnivore","Herbivore","Insectivore"],"correct":"Omnivore"},{"q":"What was the full name of the painter commonly known as Pablo Picasso?","options":["Salvador Dalí","Diego Rivera","Joan Miró","Pablo Ruiz y Picasso"],"correct":"Pablo Ruiz y Picasso"},{"q":"What is the currency of Iran?","options":["Ringgit","Shekel","Rial","Sol"],"correct":"Rial"},{"q":"What is the capital of Gabon?","options":["Kigali","Libreville","Panama City","Kampala"],"correct":"Libreville"},{"q":"Which element has the chemical symbol \"Zr\"?","options":["Beryllium","Tin","Tungsten","Zirconium"],"correct":"Zirconium"}],[{"q":"What is the capital of Uzbekistan?","options":["Bern","Tashkent","Madrid","Pyongyang"],"correct":"Tashkent"},{"q":"Who is credited with inventing dynamite?","options":["Thomas Edison","Alfred Nobel","John Moses Browning","Robert Oppenheimer"],"correct":"Alfred Nobel"},{"q":"In which country would you find Mount Fuji?","options":["Philippines","South Korea","China","Japan"],"correct":"Japan"},{"q":"Which spice, derived from the crocus flower, is the most expensive by weight?","options":["Saffron","Cinnamon","Turmeric","Paprika"],"correct":"Saffron"},{"q":"What is the name of the period of severe economic hardship that began in 1929?","options":["The Great Recession","The Great Depression","The Panic of 1893","The Gilded Age"],"correct":"The Great Depression"}],[{"q":"How many faces does a cube have?","options":["4","8","6","12"],"correct":"6"},{"q":"Which element has the chemical symbol \"Pb\"?","options":["Nitrogen","Cerium","Lead","Radon"],"correct":"Lead"},{"q":"What is the capital of Burkina Faso?","options":["Lilongwe","Yamoussoukro","Paramaribo","Ouagadougou"],"correct":"Ouagadougou"},{"q":"How many players are on a standard soccer team on the field at one time?","options":["9","12","10","11"],"correct":"11"},{"q":"What is the capital of Barbados?","options":["Brussels","Ankara","Baku","Bridgetown"],"correct":"Bridgetown"}],[{"q":"What is the currency of Australia?","options":["Rial","Zloty","Dollar","Baht"],"correct":"Dollar"},{"q":"What do you call a baby kangaroo?","options":["Kit","Joey","Cub","Calf"],"correct":"Joey"},{"q":"Who painted the \"Mona Lisa\"?","options":["Michelangelo","Vincent van Gogh","Leonardo da Vinci","Pablo Picasso"],"correct":"Leonardo da Vinci"},{"q":"What is the chemical symbol for Radon?","options":["Nd","Ni","H","Rn"],"correct":"Rn"},{"q":"Which language is the most spoken in the world when counting all speakers, including second-language speakers?","options":["Spanish","English","Mandarin Chinese","Hindi"],"correct":"English"}],[{"q":"Which musical genre originated in New Orleans in the early 20th century?","options":["Blues","Country","Jazz","Rock and roll"],"correct":"Jazz"},{"q":"Which continent is Chad located in?","options":["Oceania","Europe","Africa","South America"],"correct":"Africa"},{"q":"How many planets are in our solar system?","options":["10","9","6","8"],"correct":"8"},{"q":"What was the name of the historic trade route connecting Europe and Asia?","options":["The Amber Road","The Spice Route","The Silk Road","The Incense Route"],"correct":"The Silk Road"},{"q":"What is the capital of the U.S. state of Wisconsin?","options":["Providence","Madison","Pierre","Augusta"],"correct":"Madison"}],[{"q":"Who invented the first successful vaccine, for smallpox?","options":["Edward Jenner","Alexander Fleming","Jonas Salk","Louis Pasteur"],"correct":"Edward Jenner"},{"q":"In which city would you find the Kremlin?","options":["Moscow","Kyiv","Warsaw","St. Petersburg"],"correct":"Moscow"},{"q":"What type of food is a bagel traditionally boiled in before baking?","options":["Broth","Water","Oil","Milk"],"correct":"Water"},{"q":"What is the closest star to Earth?","options":["Betelgeuse","Sirius","The Sun","Proxima Centauri"],"correct":"The Sun"},{"q":"What is the currency of Kenya?","options":["Ruble","Shilling","Dong","Krone"],"correct":"Shilling"}],[{"q":"What is the capital of Turkmenistan?","options":["Ashgabat","Bandar Seri Begawan","Zagreb","Tripoli"],"correct":"Ashgabat"},{"q":"Which gas makes up the majority of Earth's atmosphere?","options":["Hydrogen","Oxygen","Nitrogen","Carbon dioxide"],"correct":"Nitrogen"},{"q":"What is the name of the fictional detective created by Arthur Conan Doyle?","options":["Sam Spade","Sherlock Holmes","Philip Marlowe","Hercule Poirot"],"correct":"Sherlock Holmes"},{"q":"What is the capital of the U.S. state of New Jersey?","options":["Trenton","Harrisburg","Charleston","Madison"],"correct":"Trenton"},{"q":"Which is the smallest planet in our solar system?","options":["Mercury","Venus","Pluto","Earth"],"correct":"Mercury"}],[{"q":"How many players are on a standard baseball team on the field at one time?","options":["9","11","8","10"],"correct":"9"},{"q":"In what year did World War I begin?","options":["1920","1914","1918","1910"],"corr Crisis?","options":["Leonid Brezhnev","Mikhail Gorbachev","Nikita Khrushchev","Joseph Stalin"],"correct":"Nikita Khrushchev"},{"q":"Which planet is famous for the \"Great Red Spot\" storm?","options":["Jupiter","Mars","Neptune","Saturn"],"correct":"Jupiter"},{"q":"How many players are on a standard basketball team on the court at one time?","options":["5","6","4","7"],"correct":"5"},{"q":"What is the currency of Canada?","options":["Won","Shekel","Ruble","Dollar"],"correct":"Dollar"},{"q":"What is the capital of Portugal?","options":["Banjul","Lisbon","Jakarta","Basseterre"],"correct":"Lisbon"}],[{"q":"Who developed the process of pasteurization?","options":["Gregor Mendel","Robert Koch","Louis Pasteur","Alexander Fleming"],"correct":"Louis Pasteur"},{"q":"In which city is the glass Louvre Pyramid located?","options":["Paris","Madrid","London","Berlin"],"correct":"Paris"},{"q":"Which country is credited with inventing pizza in its modern form?","options":["Greece","Spain","Italy","France"],"correct":"Italy"},{"q":"What is the capital of Bulgaria?","options":["Havana","Sofia","Vienna","Buenos Aires"],"correct":"Sofia"},{"q":"Which element has the chemical symbol \"Kr\"?","options":["Krypton","Magnesium","Nickel","Silver"],"correct":"Krypton"}],[{"q":"What is the largest mammal in the world?","options":["Giraffe","African elephant","Polar bear","Blue whale"],"correct":"Blue whale"},{"q":"Which Greek poet is credited with writing \"The Odyssey\"?","options":["Sophocles","Aristotle","Plato","Homer"],"correct":"Homer"},{"q":"What is the capital of the U.S. state of North Dakota?","options":["Sacramento","Hartford","Bismarck","Boise"],"correct":"Bismarck"},{"q":"Who wrote the Declaration of Independence?","options":["Thomas Jefferson","John Adams","Benjamin Franklin","George Washington"],"correct":"Thomas Jefferson"},{"q":"Which element has the chemical symbol \"Li\"?","options":["Vanadium","Barium","Lithium","Phosphorus"],"correct":"Lithium"}],[{"q":"What is the currency of Israel?","options":["Ruble","Zloty","Pound Sterling","Shekel"],"correct":"Shekel"},{"q":"What is the capital of South Korea?","options":["Dushanbe","Seoul","Wellington","Georgetown"],"correct":"Seoul"},{"q":"What do you call the longest side of a right triangle?","options":["Opposite","Adjacent","Base","Hypotenuse"],"correct":"Hypotenuse"},{"q":"Which planet has the most prominent ring system?","options":["Saturn","Neptune","Mars","Uranus"],"correct":"Saturn"},{"q":"What is the capital of the U.S. state of Kentucky?","options":["Raleigh","Frankfort","Springfield","Carson City"],"correct":"Frankfort"}],[{"q":"What is the term for a word that reads the same forwards and backwards?","options":["Homophone","Palindrome","Anagram","Acronym"],"correct":"Palindrome"},{"q":"Which instrument family does the violin belong to?","options":["Brass","String","Percussion","Woodwind"],"correct":"String"},{"q":"How many rings are on the Olympic flag?","options":["7","4","5","6"],"correct":"5"},{"q":"Which continent is Bulgaria located in?","options":["North America","Asia","Europe","South America"],"correct":"Europe"},{"q":"Who invented the first practical steam engine used for industry?","options":["Robert Fulton","George Stephenson","Thomas Newcomen","James Watt"],"correct":"James Watt"}],[{"q":"Which desert covers most of northern Africa?","options":["The Sahara","The Kalahari","The Gobi","The Sonoran"],"correct":"The Sahara"},{"q":"Which nut is used to make traditional marzipan?","options":["Cashews","Almonds","Walnuts","Pistachios"],"correct":"Almonds"},{"q":"What is the chemical symbol for Manganese?","options":["Zn","Ne","H","Mn"],"correct":"Mn"},{"q":"What is the largest species of shark?","options":["Whale shark","Hammerhead shark","Tiger shark","Great white shark"],"correct":"Whale shark"},{"q":"Who composed the ballet \"Swan Lake\"?","options":["Igor Stravinsky","Pyotr Ilyich Tchaikovsky","Frédéric Chopin","Sergei Prokofiev"],"correct":"Pyotr Ilyich Tchaikovsky"}],[{"q":"In what year did World War II end?","options":["1918","1945","1939","1950"],"correct":"1945"},{"q":"What is the currency of Vietnam?","options":["Rupee","Krona","Dong","Won"],"correct":"Dong"},{"q":"What is the capital of the U.S. state of South Carolina?","options":["Boston","Baton Rouge","Columbia","Indianapolis"],"correct":"Columbia"},{"q":"Which element has the chemical symbol \"Ne\"?","options":["Neon","Radon","Gallium","Vanadium"],"correct":"Neon"},{"q":"What is the capital of Mauritius?","options":["Conakry","Bangkok","Port Louis","Ashgabat"],"correct":"Port Louis"}]];

const MAX_QUESTIONS = 5;
const STORAGE_KEY = 'brain-buzzer-state-v1';
const STREAK_KEY = 'brain-buzzer-streak-v1';
const SOUND_KEY = 'brain-buzzer-sound-v1';
const TIER_MESSAGE = {5:'Perfect Score!',4:'Great Job!',3:'Nice Work!',2:'Not Bad!',1:'Keep Trying!',0:'Better Luck Tomorrow!'};

const dayLabelEl = document.getElementById('dayLabel');
const streakCountEl = document.getElementById('streakCount');
const liveScoreEl = document.getElementById('liveScore');
const progressDotsEl = document.getElementById('progressDots');
const qCounterEl = document.getElementById('qCounter');
const qTextEl = document.getElementById('qText');
const optionsWrapEl = document.getElementById('optionsWrap');
const quizCardEl = document.getElementById('quizCard');
const muteBtnEl = document.getElementById('muteBtn');
const summaryEl = document.getElementById('summary');
const summaryTitleEl = document.getElementById('summaryTitle');
const summaryScoreEl = document.getElementById('summaryScore');
const summaryMetaEl = document.getElementById('summaryMeta');
const reviewListEl = document.getElementById('reviewList');
const copyResultBtn = document.getElementById('copyResultBtn');
const closeSummaryBtn = document.getElementById('closeSummaryBtn');
const countdownTimerEl = document.getElementById('countdownTimer');

function dayNumber(){
  const epoch = Date.UTC(2026, 0, 1);
  const now = Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate());
  return Math.floor((now - epoch) / 86400000) + 1;
}

function seededShuffle(arr, seed){
  const a = arr.slice();
  let s = seed >>> 0;
  const rand = () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function dailyPackIndex(){
  const n = dayNumber() - 1;
  const cycleIndex = Math.floor(n / DAYS.length);
  const dayInCycle = n % DAYS.length;
  const dealt = seededShuffle(DAYS.map((_, i) => i), cycleIndex + 1);
  return dealt[dayInCycle];
}

function freshRun(){
  return {
    day: dayNumber(),
    packIndex: dailyPackIndex(),
    currentIndex: 0,
    score: 0,
    answers: [],
    finished: false,
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshRun();
    const parsed = JSON.parse(raw);
    if(parsed.day !== dayNumber()) return freshRun();
    return parsed;
  }catch(e){ return freshRun(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(run)); }catch(e){}
}

function loadStreak(){
  try{
    const parsed = JSON.parse(localStorage.getItem(STREAK_KEY));
    if(parsed && typeof parsed.current === 'number') return parsed;
  }catch(e){}
  return { current: 0, lastPlayedDay: 0 };
}
function saveStreak(s){
  try{ localStorage.setItem(STREAK_KEY, JSON.stringify(s)); }catch(e){}
}

let soundEnabled = true;
try{ soundEnabled = localStorage.getItem(SOUND_KEY) !== '0'; }catch(e){}
let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    try{ audioCtx = new Ctx(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, offset, duration, type, peakVol){
  if(!soundEnabled) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + (offset || 0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(peakVol != null ? peakVol : 0.16, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}
function playSweep(freqStart, freqEnd, offset, duration, type, peakVol){
  if(!soundEnabled) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sawtooth';
  const t0 = ctx.currentTime + (offset || 0);
  osc.frequency.setValueAtTime(freqStart, t0);
  osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + duration);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(peakVol != null ? peakVol : 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}
function playCorrectSound(){
  playTone(600, 0, 0.1, 'triangle', 0.15);
  playTone(800, 0.08, 0.14, 'triangle', 0.16);
}
function playWrongSound(){ playTone(180, 0, 0.18, 'sawtooth', 0.12); }
function playWinSound(){
  playTone(523, 0, 0.12, 'triangle', 0.16);
  playTone(659, 0.1, 0.12, 'triangle', 0.16);
  playTone(784, 0.2, 0.22, 'triangle', 0.18);
}
function playLoseSound(){ playSweep(300, 140, 0, 0.4, 'sawtooth', 0.1); }
function updateMuteButton(){ muteBtnEl.classList.toggle('is-muted', !soundEnabled); }
muteBtnEl.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  try{ localStorage.setItem(SOUND_KEY, soundEnabled ? '1' : '0'); }catch(e){}
  updateMuteButton();
  if(soundEnabled){ ensureAudioCtx(); playCorrectSound(); }
});
updateMuteButton();

let run = loadState();
const pack = DAYS[run.packIndex];
let answered = false;

function renderProgressDots(){
  progressDotsEl.innerHTML = '';
  for(let i = 0; i < MAX_QUESTIONS; i++){
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if(i < run.answers.length){
      dot.classList.add(run.answers[i].isCorrect ? 'is-correct' : 'is-wrong');
    } else if(i === run.currentIndex && !run.finished){
      dot.classList.add('is-current');
    }
    progressDotsEl.appendChild(dot);
  }
}

function renderQuestion(){
  answered = false;
  const q = pack[run.currentIndex];
  qCounterEl.textContent = 'Question ' + (run.currentIndex + 1) + ' of ' + MAX_QUESTIONS;
  qTextEl.textContent = q.q;
  optionsWrapEl.innerHTML = '';
  const badges = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option-btn';
    btn.dataset.option = opt;
    btn.innerHTML = '<span class="option-badge">' + badges[i] + '</span><span>' + opt + '</span>';
    btn.addEventListener('click', () => selectAnswer(opt, btn, q));
    optionsWrapEl.appendChild(btn);
  });
  renderProgressDots();
  liveScoreEl.textContent = run.score;
}

function selectAnswer(option, btnEl, q){
  if(answered || run.finished) return;
  answered = true;
  const isCorrect = option === q.correct;
  run.answers.push({ question: q.q, selected: option, correct: q.correct, isCorrect });
  if(isCorrect) run.score++;

  Array.from(optionsWrapEl.children).forEach(btn => {
    btn.disabled = true;
    if(btn.dataset.option === q.correct) btn.classList.add('is-correct');
    else if(btn === btnEl) btn.classList.add('is-wrong');
  });

  if(isCorrect) playCorrectSound(); else playWrongSound();
  renderProgressDots();
  liveScoreEl.textContent = run.score;
  saveState();

  setTimeout(() => {
    if(run.answers.length >= MAX_QUESTIONS){
      run.finished = true;
      resolveRound();
    } else {
      run.currentIndex++;
      saveState();
      renderQuestion();
    }
  }, 1400);
}

function msUntilNextReset(){
  const now = new Date();
  const nextMidnightUtc = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0);
  return Math.max(0, nextMidnightUtc - now.getTime());
}
function formatCountdown(ms){
  const totalSeconds = Math.floor(ms / 1000);
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
let countdownIntervalId = null;
function startCountdown(){
  stopCountdown();
  const tick = () => { countdownTimerEl.textContent = formatCountdown(msUntilNextReset()); };
  tick();
  countdownIntervalId = setInterval(tick, 1000);
}
function stopCountdown(){
  if(countdownIntervalId){ clearInterval(countdownIntervalId); countdownIntervalId = null; }
}

function resultEmojiRow(){
  return run.answers.map(a => a.isCorrect ? '✅' : '❌').join('');
}

function reportStats(){
  if(window.parent === window) return;
  const streak = loadStreak();
  window.parent.postMessage({
    type: 'brain-buzzer-progress',
    score: run.score,
    dayNumber: run.day,
    streak: streak.current,
  }, window.location.origin);
}

function resolveRound(){
  saveState();
  const streak = loadStreak();
  streak.current = (streak.lastPlayedDay === run.day - 1) ? streak.current + 1 : 1;
  streak.lastPlayedDay = run.day;
  saveStreak(streak);
  streakCountEl.textContent = streak.current;
  reportStats();
  if(run.score >= 4) playWinSound(); else if(run.score <= 1) playLoseSound();
  setTimeout(showSummary, 500);
}

function showSummary(){
  const streak = loadStreak();
  summaryTitleEl.textContent = TIER_MESSAGE[run.score] || TIER_MESSAGE[0];
  summaryScoreEl.textContent = run.score + '/5';
  summaryMetaEl.textContent = streak.current + (streak.current === 1 ? ' day streak' : ' day streak');
  reviewListEl.innerHTML = '';
  run.answers.forEach((a, i) => {
    const row = document.createElement('div');
    row.className = 'review-row';
    const icon = document.createElement('span');
    icon.className = 'review-icon';
    icon.textContent = a.isCorrect ? '✅' : '❌';
    const textWrap = document.createElement('div');
    textWrap.className = 'review-text';
    const rq = document.createElement('div');
    rq.className = 'rq';
    rq.textContent = (i + 1) + '. ' + a.question;
    const ra = document.createElement('div');
    ra.className = 'ra' + (a.isCorrect ? '' : ' wrong-answer');
    ra.textContent = a.isCorrect ? 'Your answer: ' + a.selected : 'You said ' + a.selected + ' — correct: ' + a.correct;
    textWrap.appendChild(rq);
    textWrap.appendChild(ra);
    row.appendChild(icon);
    row.appendChild(textWrap);
    reviewListEl.appendChild(row);
  });
  summaryEl.classList.remove('hidden');
  startCountdown();
}

copyResultBtn.addEventListener('click', () => {
  const text = 'Brain Buzzer #' + run.day + ' ' + run.score + '/5\n\n' + resultEmojiRow();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      const original = copyResultBtn.textContent;
      copyResultBtn.textContent = 'Copied!';
      setTimeout(() => { copyResultBtn.textContent = original; }, 1500);
    });
  }
});
closeSummaryBtn.addEventListener('click', () => {
  summaryEl.classList.add('hidden');
  stopCountdown();
});

function setupRound(){
  dayLabelEl.textContent = 'Day ' + run.day;
  streakCountEl.textContent = loadStreak().current;
  if(run.finished){
    liveScoreEl.textContent = run.score;
    renderProgressDots();
    quizCardEl.style.visibility = 'hidden';
    showSummary();
  } else {
    renderQuestion();
  }
}
setupRound();
</script>
