<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Five by Five</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg-deep:#050b12;
    --panel:#0c1a22;
    --panel-border:#1d4438;
    --signal:#39ff9d;
    --signal-bright:#c3ffe6;
    --signal-dim:rgba(57,255,157,.14);
    --amber:#ffb454;
    --amber-dim:rgba(255,180,84,.16);
    --text:#d8fbe8;
    --text-dim:#5d8677;
    --black-cell:#02070a;
    --danger:#ff5f6d;
    --font-display:'Share Tech Mono',monospace;
    --font-body:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 20% -10%, rgba(57,255,157,.09) 0%, transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(255,180,84,.06) 0%, transparent 40%),
      var(--bg-deep);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 12px 10px;
  }
  header{
    width:100%;
    max-width:460px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:2px solid var(--panel-border);
    padding-bottom:10px;
    margin-bottom:10px;
  }
  .title-block h1{
    font-family:var(--font-display);
    font-size:24px;
    letter-spacing:.06em;
    margin:0;
    color:var(--signal-bright);
    text-shadow:0 0 14px rgba(57,255,157,.4);
  }
  .title-block p{
    margin:2px 0 0;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .header-right{display:flex;align-items:center;gap:8px;}
  .streak-badge{
    display:flex;align-items:center;gap:4px;
    font-weight:700;font-size:13px;
    color:var(--amber);
    background:var(--amber-dim);
    border:1px solid var(--amber);
    border-radius:999px;
    padding:4px 10px;
  }
  .home-btn,.mute-btn{
    width:32px;height:32px;
    border-radius:6px;
    border:1.5px solid var(--panel-border);
    background:var(--panel);
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    cursor:pointer;
  }
  .mute-btn.is-muted::after{content:'\1F507';}
  .mute-btn::after{content:'\1F50A';}

  .clue-banner{
    width:min(400px,96vw);
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1.5px solid var(--panel-border);
    border-radius:8px;
    padding:9px 14px;
    margin-bottom:12px;
    cursor:pointer;
    min-height:20px;
  }
  .clue-banner .dir-icon{
    font-family:var(--font-display);
    font-size:13px;
    color:var(--bg-deep);
    background:var(--signal);
    border-radius:4px;
    padding:2px 6px;
    flex-shrink:0;
  }
  .clue-banner .clue-text{
    font-size:14px;
    color:var(--text);
    line-height:1.3;
  }
  .clue-banner .clue-num{color:var(--signal-bright);font-weight:700;margin-right:4px;}

  .grid-wrap{position:relative;}
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:4px;
    width:min(320px,80vw);
    aspect-ratio:1;
    margin:0 auto 14px;
  }
  .cell{
    position:relative;
    background:var(--panel);
    border:1.5px solid var(--panel-border);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-display);
    font-size:clamp(16px,5vw,24px);
    color:var(--text);
    cursor:pointer;
    transition:background 120ms ease,border-color 120ms ease;
  }
  .cell.is-black{
    background:var(--black-cell);
    border-color:var(--black-cell);
    cursor:default;
  }
  .cell .cell-num{
    position:absolute;
    top:2px;left:3px;
    font-size:9px;
    color:var(--text-dim);
    font-family:var(--font-body);
    font-weight:700;
  }
  .cell.in-word{background:var(--signal-dim);border-color:var(--panel-border);}
  .cell.is-selected{background:var(--amber-dim);border-color:var(--amber);}
  .cell.is-wrong{animation:cellShake 380ms ease;border-color:var(--danger);}
  .cell.is-solved{border-color:var(--signal);color:var(--signal-bright);}
  @keyframes cellShake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(3px);}
    30%,50%,70%{transform:translateX(-4px);}
    40%,60%{transform:translateX(4px);}
  }

  .clue-lists{
    width:min(400px,96vw);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:10px;
  }
  .clue-col h3{
    font-family:var(--font-display);
    font-size:12px;
    letter-spacing:.1em;
    color:var(--text-dim);
    margin:0 0 6px;
  }
  .clue-col ul{list-style:none;margin:0;padding:0;}
  .clue-col li{
    font-size:12px;
    color:var(--text-dim);
    padding:4px 0;
    cursor:pointer;
    line-height:1.35;
  }
  .clue-col li b{color:var(--text);font-weight:700;margin-right:4px;}
  .clue-col li.is-active{color:var(--signal-bright);}
  .clue-col li.is-active b{color:var(--signal-bright);}
  .clue-col li.is-filled{color:var(--text-dim);opacity:.55;}

  .keyboard{
    width:100%;
    max-width:460px;
    margin-top:auto;
    padding:6px 0 10px;
  }
  .keyboard-row{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-bottom:6px;
  }
  .key{
    flex:1;
    max-width:34px;
    height:42px;
    border:1.5px solid var(--panel-border);
    border-radius:5px;
    background:var(--panel);
    color:var(--text);
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background 120ms ease,transform 80ms ease;
  }
  .key:active{transform:scale(.92);background:var(--signal-dim);}
  .key.key-wide{max-width:58px;font-size:11px;}

  .summary{
    position:absolute;
    inset:0;
    z-index:5;
    background:rgba(2,7,10,.88);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .summary.hidden{display:none;}
  .summary-card{
    width:min(400px,100%);
    max-height:88vh;
    overflow-y:auto;
    background:var(--panel);
    border:2px solid var(--signal);
    border-radius:10px;
    padding:26px 28px;
    text-align:center;
    box-shadow:0 0 60px -10px rgba(57,255,157,.25);
  }
  .summary-card h2{
    font-family:var(--font-display);
    font-size:26px;
    letter-spacing:.03em;
    margin:0 0 10px;
    color:var(--signal-bright);
  }
  .summary-stats{
    display:flex;
    justify-content:center;
    gap:22px;
    margin:10px 0 16px;
  }
  .summary-stat .num{
    font-family:var(--font-display);
    font-size:26px;
    color:var(--signal-bright);
  }
  .summary-stat .lbl{
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-top:2px;
  }
  .summary-meta{font-size:13px;color:var(--text-dim);margin:0 0 16px;}
  .summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .summary-actions button{
    font-family:var(--font-body);
    font-weight:700;
    font-size:13px;
    border-radius:6px;
    padding:11px 18px;
    cursor:pointer;
  }
  #copyResultBtn{background:var(--signal);color:#03150c;border:1px solid var(--signal);}
  #copyResultBtn:hover{background:var(--signal-bright);}
  #closeSummaryBtn{background:transparent;color:var(--text-dim);border:1px solid var(--panel-border);}

  .countdown-block{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--panel-border);
    text-align:center;
  }
  .countdown-label{font-size:12px;color:var(--text-dim);margin:0 0 8px;}
  .countdown-timer{
    font-family:var(--font-display);
    font-size:28px;
    letter-spacing:.05em;
    color:var(--signal-bright);
    margin:0;
  }
  .countdown-sub{font-size:10px;color:var(--text-dim);margin:6px 0 0;}

  @media (prefers-reduced-motion: reduce){
    .cell.is-wrong{animation:none!important;}
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="title-block">
      <h1>Five by Five</h1>
      <p id="dayLabel">Day 1</p>
    </div>
    <div class="header-right">
      <a class="home-btn" href="/" target="_top" aria-label="Back to Adam Games home" title="Back to home">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      </a>
      <div class="streak-badge">🔥 <span id="streakCount">0</span></div>
      <button class="mute-btn" id="muteBtn" type="button" aria-label="Toggle sound" title="Toggle sound"></button>
    </div>
  </header>

  <div class="clue-banner" id="clueBanner">
    <span class="dir-icon" id="clueDirIcon">→</span>
    <span class="clue-text"><span class="clue-num" id="clueNum">1</span><span id="clueText">Loading…</span></span>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="clue-lists">
    <div class="clue-col">
      <h3>Across</h3>
      <ul id="acrossList"></ul>
    </div>
    <div class="clue-col">
      <h3>Down</h3>
      <ul id="downList"></ul>
    </div>
  </div>

  <div class="keyboard" id="keyboard"></div>

  <div class="summary hidden" id="summary">
    <div class="summary-card">
      <h2 id="summaryTitle">Signal Locked</h2>
      <div class="summary-stats">
        <div class="summary-stat"><div class="num" id="summaryTime">0:00</div><div class="lbl">Time</div></div>
        <div class="summary-stat"><div class="num" id="summaryStreak">0</div><div class="lbl">Day Streak</div></div>
      </div>
      <p class="summary-meta" id="summaryMeta"></p>
      <div class="summary-actions">
        <button id="copyResultBtn">Copy Result</button>
        <button id="closeSummaryBtn">Close</button>
      </div>
      <div class="countdown-block">
        <p class="countdown-label">You've already cracked today's grid</p>
        <p class="countdown-timer" id="countdownTimer">--:--:--</p>
        <p class="countdown-sub">until the next one unlocks</p>
      </div>
    </div>
  </div>
</div>

function dayNumber(){
  const epoch = Date.UTC(2026, 0, 1);
  const now = Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate());
  return Math.floor((now - epoch) / 86400000) + 1;
}
function seededShuffle(arr, seed){
  const a = arr.slice();
  let s = seed >>> 0;
  const rand = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function dailyPuzzleIndex(day){
  const cycleIndex = Math.floor((day - 1) / POOL_SIZE);
  const dayInCycle = (day - 1) % POOL_SIZE;
  const order = seededShuffle(Array.from({length: POOL_SIZE}, (_, i) => i), cycleIndex + 1);
  return order[dayInCycle];
}

let soundEnabled = true;
try{ soundEnabled = localStorage.getItem(SOUND_KEY) !== '0'; }catch(e){}
let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    try{ audioCtx = new Ctx(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, offset, duration, type, peakVol){
  if(!soundEnabled) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + (offset || 0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(peakVol != null ? peakVol : 0.16, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}
function playSweep(freqStart, freqEnd, offset, duration, type, peakVol){
  if(!soundEnabled) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sawtooth';
  const t0 = ctx.currentTime + (offset || 0);
  osc.frequency.setValueAtTime(freqStart, t0);
  osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + duration);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(peakVol != null ? peakVol : 0.14, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function preparePuzzle(raw){
  const blacks = new Set(raw.blacks.map(([r, c]) => r + ',' + c));
  const solution = Array.from({length: SIZE}, () => new Array(SIZE).fill(null));
  const entries = raw.entries.map(e => {
    const cells = [];
    for(let i = 0; i < e.length; i++){
      const r = e.dir === 'across' ? e.row : e.row + i;
      const c = e.dir === 'across' ? e.col + i : e.col;
      cells.push([r, c]);
      solution[r][c] = e.answer[i];
    }
    return Object.assign({}, e, { cells });
  });
  entries.sort((a, b) => a.number - b.number || (a.dir === 'across' ? -1 : 1));
  return { blacks, solution, entries };
}

function freshRun(){
  const day = dayNumber();
  const idx = dailyPuzzleIndex(day);
  return {
    day: day,
    puzzleIndex: idx,
    grid: Array.from({length: SIZE}, () => new Array(SIZE).fill('')),
    elapsedSeconds: 0,
    finished: false,
    solved: false,
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshRun();
    const parsed = JSON.parse(raw);
    if(parsed.day !== dayNumber()) return freshRun();
    return parsed;
  }catch(e){ return freshRun(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(run)); }catch(e){}
}
function loadStreak(){
  try{
    const parsed = JSON.parse(localStorage.getItem(STREAK_KEY));
    if(parsed && typeof parsed.current === 'number') return parsed;
  }catch(e){}
  return { current: 0, lastSolvedDay: 0 };
}
function saveStreak(s){
  try{ localStorage.setItem(STREAK_KEY, JSON.stringify(s)); }catch(e){}
}

let run = loadState();
const puzzle = preparePuzzle(PUZZLES[run.puzzleIndex]);
let selected = null; // {r, c}
let direction = 'across';
let timerIntervalId = null;

function entryAt(r, c, dir){
  return puzzle.entries.find(e => e.dir === dir && e.cells.some(([cr, cc]) => cr === r && cc === c));
}
function bothDirectionsAt(r, c){
  return { across: entryAt(r, c, 'across'), down: entryAt(r, c, 'down') };
}

function buildGrid(){
  gridEl.innerHTML = '';
  const cellEls = [];
  for(let r = 0; r < SIZE; r++){
    const rowEls = [];
    for(let c = 0; c < SIZE; c++){
      const cellEl = document.createElement('div');
      const key = r + ',' + c;
      if(puzzle.blacks.has(key)){
        cellEl.className = 'cell is-black';
      } else {
        cellEl.className = 'cell';
        const entry = puzzle.entries.find(e => e.number && e.cells[0][0] === r && e.cells[0][1] === c);
        if(entry){
          const num = document.createElement('span');
          num.className = 'cell-num';
          num.textContent = entry.number;
          cellEl.appendChild(num);
        }
        const letterSpan = document.createElement('span');
        letterSpan.className = 'cell-letter';
        cellEl.appendChild(letterSpan);
        cellEl.addEventListener('click', () => selectCell(r, c, null));
      }
      gridEl.appendChild(cellEl);
      rowEls.push(cellEl);
    }
    cellEls.push(rowEls);
  }
  return cellEls;
}
const cellEls = buildGrid();

function firstWhiteCell(){
  for(let r = 0; r < SIZE; r++) for(let c = 0; c < SIZE; c++) if(!puzzle.blacks.has(r + ',' + c)) return [r, c];
  return [0, 0];
}

function selectCell(r, c, forceDir){
  if(puzzle.blacks.has(r + ',' + c)) return;
  const both = bothDirectionsAt(r, c);
  if(forceDir){
    direction = forceDir;
  } else if(selected && selected.r === r && selected.c === c){
    if(both.across && both.down) direction = direction === 'across' ? 'down' : 'across';
  } else if(!both[direction]){
    direction = direction === 'across' ? 'down' : 'across';
  }
  selected = { r, c };
  render();
}

function currentEntry(){
  if(!selected) return null;
  return entryAt(selected.r, selected.c, direction) || entryAt(selected.r, selected.c, direction === 'across' ? 'down' : 'across');
}

function render(){
  const active = currentEntry();
  const activeCellKeys = new Set(active ? active.cells.map(([r, c]) => r + ',' + c) : []);
  for(let r = 0; r < SIZE; r++){
    for(let c = 0; c < SIZE; c++){
      const el = cellEls[r][c];
      if(puzzle.blacks.has(r + ',' + c)) continue;
      const letterSpan = el.querySelector('.cell-letter');
      letterSpan.textContent = run.grid[r][c] || '';
      el.classList.toggle('in-word', activeCellKeys.has(r + ',' + c));
      el.classList.toggle('is-selected', !!selected && selected.r === r && selected.c === c);
      el.classList.toggle('is-solved', run.finished && run.solved);
    }
  }
  if(active){
    clueDirIconEl.textContent = active.dir === 'across' ? '→' : '↓';
    clueNumEl.textContent = active.number;
    clueTextEl.textContent = active.clue;
  }
  renderClueLists(active);
}

function entryIsFilled(entry){
  return entry.cells.every(([r, c]) => !!run.grid[r][c]);
}
function renderClueLists(active){
  acrossListEl.innerHTML = '';
  downListEl.innerHTML = '';
  puzzle.entries.forEach(e => {
    const li = document.createElement('li');
    const b = document.createElement('b');
    b.textContent = e.number + '.';
    li.appendChild(b);
    li.appendChild(document.createTextNode(e.clue));
    if(active && e === active) li.classList.add('is-active');
    if(entryIsFilled(e)) li.classList.add('is-filled');
    li.addEventListener('click', () => {
      const target = e.cells.find(([r, c]) => !run.grid[r][c]) || e.cells[0];
      selectCell(target[0], target[1], e.dir);
    });
    (e.dir === 'across' ? acrossListEl : downListEl).appendChild(li);
  });
}

function advanceAfterType(){
  const entry = currentEntry();
  if(!entry) return;
  const idx = entry.cells.findIndex(([r, c]) => r === selected.r && c === selected.c);
  if(idx < entry.cells.length - 1){
    const [nr, nc] = entry.cells[idx + 1];
    selected = { r: nr, c: nc };
  } else {
    if(entryIsFilled(entry)) playWordSound();
    const order = puzzle.entries;
    const curIdx = order.indexOf(entry);
    for(let step = 1; step <= order.length; step++){
      const next = order[(curIdx + step) % order.length];
      const emptyCell = next.cells.find(([r, c]) => !run.grid[r][c]);
      if(emptyCell){ selected = { r: emptyCell[0], c: emptyCell[1] }; direction = next.dir; break; }
    }
  }
}
function moveBack(){
  const entry = currentEntry();
  if(!entry) return;
  const idx = entry.cells.findIndex(([r, c]) => r === selected.r && c === selected.c);
  if(run.grid[selected.r][selected.c]){
    run.grid[selected.r][selected.c] = '';
  } else if(idx > 0){
    const [pr, pc] = entry.cells[idx - 1];
    selected = { r: pr, c: pc };
    run.grid[pr][pc] = '';
  }
}

function isGridFull(){
  for(let r = 0; r < SIZE; r++) for(let c = 0; c < SIZE; c++){
    if(!puzzle.blacks.has(r + ',' + c) && !run.grid[r][c]) return false;
  }
  return true;
}
function isGridCorrect(){
  for(let r = 0; r < SIZE; r++) for(let c = 0; c < SIZE; c++){
    if(!puzzle.blacks.has(r + ',' + c) && run.grid[r][c] !== puzzle.solution[r][c]) return false;
  }
  return true;
}
function flashWrongCells(){
  for(let r = 0; r < SIZE; r++){
    for(let c = 0; c < SIZE; c++){
      if(puzzle.blacks.has(r + ',' + c)) continue;
      if(run.grid[r][c] && run.grid[r][c] !== puzzle.solution[r][c]){
        const el = cellEls[r][c];
        el.classList.remove('is-wrong');
        void el.offsetWidth;
        el.classList.add('is-wrong');
      }
    }
  }
  playInvalidSound();
}

function typeLetter(letter){
  if(run.finished || !selected) return;
  if(puzzle.blacks.has(selected.r + ',' + selected.c)) return;
  run.grid[selected.r][selected.c] = letter;
  playKeySound();
  advanceAfterType();
  render();
  saveState();
  if(isGridFull()){
    if(isGridCorrect()){
      finishPuzzle();
    } else {
      flashWrongCells();
    }
  }
}
function backspace(){
  if(run.finished || !selected) return;
  moveBack();
  render();
  saveState();
}

function handlePhysicalKey(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(run.finished) return;
  if(/^[a-zA-Z]$/.test(e.key)){ typeLetter(e.key.toUpperCase()); return; }
  if(e.key === 'Backspace'){ backspace(); return; }
  if(!selected) return;
  const { r, c } = selected;
  if(e.key === 'ArrowRight' && c < SIZE - 1 && !puzzle.blacks.has(r + ',' + (c+1))){ selectCell(r, c+1, 'across'); }
  else if(e.key === 'ArrowLeft' && c > 0 && !puzzle.blacks.has(r + ',' + (c-1))){ selectCell(r, c-1, 'across'); }
  else if(e.key === 'ArrowDown' && r < SIZE - 1 && !puzzle.blacks.has((r+1) + ',' + c)){ selectCell(r+1, c, 'down'); }
  else if(e.key === 'ArrowUp' && r > 0 && !puzzle.blacks.has((r-1) + ',' + c)){ selectCell(r-1, c, 'down'); }
}
document.addEventListener('keydown', handlePhysicalKey);

clueBannerEl.addEventListener('click', () => {
  if(!selected) return;
  const both = bothDirectionsAt(selected.r, selected.c);
  if(both.across && both.down){ direction = direction === 'across' ? 'down' : 'across'; render(); }
});

const KEYBOARD_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M','Backspace'],
];
KEYBOARD_ROWS.forEach(row => {
  const rowEl = document.createElement('div');
  rowEl.className = 'keyboard-row';
  row.forEach(k => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const isWide = k === 'Backspace';
    btn.className = 'key' + (isWide ? ' key-wide' : '');
    btn.textContent = k === 'Backspace' ? '⌫' : k;
    btn.addEventListener('click', () => { k === 'Backspace' ? backspace() : typeLetter(k); });
    rowEl.appendChild(btn);
  });
  keyboardEl.appendChild(rowEl);
});

function msUntilNextReset(){
  const now = new Date();
  const nextMidnightUtc = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0);
  return Math.max(0, nextMidnightUtc - now.getTime());
}
function formatCountdown(ms){
  const totalSeconds = Math.floor(ms / 1000);
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
let countdownIntervalId = null;
function startCountdown(){
  stopCountdown();
  const tick = () => { countdownTimerEl.textContent = formatCountdown(msUntilNextReset()); };
  tick();
  countdownIntervalId = setInterval(tick, 1000);
}
function stopCountdown(){
  if(countdownIntervalId){ clearInterval(countdownIntervalId); countdownIntervalId = null; }
}

function formatTime(totalSeconds){
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function startTimer(){
  stopTimer();
  timerIntervalId = setInterval(() => {
    run.elapsedSeconds++;
    saveState();
  }, 1000);
}
function stopTimer(){
  if(timerIntervalId){ clearInterval(timerIntervalId); timerIntervalId = null; }
}

function reportStats(){
  if(window.parent === window) return;
  const streak = loadStreak();
  window.parent.postMessage({
    type: 'five-by-five-progress',
    solved: run.solved,
    dayNumber: run.day,
    timeSeconds: run.elapsedSeconds,
    streak: streak.current,
  }, window.location.origin);
}

function finishPuzzle(){
  run.finished = true;
  run.solved = true;
  stopTimer();
  saveState();
  const streak = loadStreak();
  streak.current = (streak.lastSolvedDay === run.day - 1) ? streak.current + 1 : 1;
  streak.lastSolvedDay = run.day;
  saveStreak(streak);
  streakCountEl.textContent = streak.current;
  reportStats();
  playWinSound();
  render();
  setTimeout(showSummary, 500);
}

function showSummary(){
  const streak = loadStreak();
  summaryTitleEl.textContent = 'Signal Locked';
  summaryTimeEl.textContent = formatTime(run.elapsedSeconds);
  summaryStreakEl.textContent = streak.current;
  summaryMetaEl.textContent = 'Day ' + run.day + ' solved';
  summaryEl.classList.remove('hidden');
  startCountdown();
}
copyResultBtn.addEventListener('click', () => {
  const text = 'Five by Five #' + run.day + ' — solved in ' + formatTime(run.elapsedSeconds);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      const original = copyResultBtn.textContent;
      copyResultBtn.textContent = 'Copied!';
      setTimeout(() => { copyResultBtn.textContent = original; }, 1500);
    });
  }
});
closeSummaryBtn.addEventListener('click', () => {
  summaryEl.classList.add('hidden');
  stopCountdown();
});

function setupRound(){
  dayLabelEl.textContent = 'Day ' + run.day;
  streakCountEl.textContent = loadStreak().current;
  const start = firstWhiteCell();
  selected = { r: start[0], c: start[1] };
  direction = 'across';
  render();
  if(run.finished){
    showSummary();
  } else {
    startTimer();
  }
}
setupRound();
</script>
